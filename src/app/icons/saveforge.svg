<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- SaveForge app icon (Forja): the anvil of Icons.anvil on a warm dark tile.
       Source of the .ico/.icns/.png files next to it; see tools/icons/README.md. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A231B"/>
      <stop offset="1" stop-color="#16130F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.66" r="0.48">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FB8A3C"/>
      <stop offset="1" stop-color="#EA580C"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#tile)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#glow)"/>
  <rect x="44" y="44" width="936" height="936" rx="208" fill="none" stroke="#3A3127" stroke-width="8"/>
  <!-- 24-unit glyph grid scaled to 768 px and centred. -->
  <g transform="translate(128 112) scale(32)" stroke="#F97316" stroke-width="2.2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 15h16l-2 5H6z" fill="url(#metal)"/>
    <path d="M8 15V9h8v6" fill="#F97316" fill-opacity="0.18"/>
    <path d="M12 9V4" fill="none"/>
    <path d="M9 6l3-2 3 2" fill="none"/>
  </g>
</svg>
