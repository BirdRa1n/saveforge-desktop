      <stop offset="0" stop-color="#1B2029"/>
      <stop offset="1" stop-color="#0F1218"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#tile)"/>
  <rect x="40" y="40" width="944" height="944" rx="212" fill="url(#glow)"/>
